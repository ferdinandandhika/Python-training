<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Struk TokoKu</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #1E2A44;
    font-family: Arial, sans-serif;
  }
  .struk {
    width: 100%;
    max-width: 380px;
    padding: 28px;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 16px 40px #10182766;
  }
  .label {
    margin: 0;
    color: #0F766E;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    text-align: center;
  }
  h1 {
    margin: 8px 0 4px;
    color: #1E2A44;
    text-align: center;
  }
  .subjudul {
    margin: 0 0 24px;
    color: #64748B;
    text-align: center;
  }
  .baris {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid #E2E8F0;
  }
  .baris span { color: #64748B; }
  .baris strong { color: #1E293B; text-align: right; }
  .diskon strong { color: #0F766E; }
  .total {
    margin-top: 8px;
    padding-top: 16px;
    border-top: 2px dashed #94A3B8;
    border-bottom: 0;
  }
  .total span, .total strong {
    color: #0F766E;
    font-size: 18px;
    font-weight: bold;
  }
  .terima-kasih {
    margin: 20px 0 0;
    color: #64748B;
    text-align: center;
  }
</style>
</head>
<body>
<main class="struk">
  <p class="label">PEMBAYARAN BERHASIL</p>
  <h1>TOKOKU</h1>
  <p class="subjudul">Ringkasan transaksi</p>
  <div class="baris"><span>Pelanggan</span><strong>Ucup</strong></div>
  <div class="baris"><span>Menu</span><strong>Kopi Susu Aren</strong></div>
  <div class="baris"><span>Harga satuan</span><strong>Rp 25.000</strong></div>
  <div class="baris"><span>Jumlah</span><strong>1</strong></div>
  <div class="baris"><span>Subtotal</span><strong>Rp 25.000</strong></div>
  <div class="baris diskon"><span>Diskon (0%)</span><strong>-Rp 0</strong></div>
  <div class="baris"><span>Pajak (11%)</span><strong>Rp 2.750</strong></div>
  <div class="baris total"><span>Total bayar</span><strong>Rp 27.750</strong></div>
  <p class="terima-kasih">Terima kasih, Ucup!</p>
</main>
</body>
</html>
