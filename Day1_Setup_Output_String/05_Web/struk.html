<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="3">
<title>Struk TokoKu</title>
<style>
  body   { font-family: Arial; background: #1E2A44; display: flex; justify-content: center; padding-top: 60px; }
  .struk { background: white; width: 300px; padding: 24px; border-radius: 10px; }
  h1     { text-align: center; color: #1E2A44; margin: 0 0 16px; }
  .baris { display: flex; justify-content: space-between; padding: 4px 0; }
  .total { border-top: 2px dashed #999; margin-top: 10px; padding-top: 10px; font-weight: bold; color: #0F766E; }
  p      { text-align: center; }
</style>
</head>
<body>
<div class="struk">
  <h1>TOKOKU</h1>
  <div class="baris"><span>Pelanggan</span><span>Ferdi</span></div>
  <div class="baris"><span>Menu</span><span>Game</span></div>
  <div class="baris"><span>Harga</span><span>Rp 500.000</span></div>
  <div class="baris"><span>Jumlah</span><span>2</span></div>
  <div class="baris total"><span>TOTAL</span><span>Rp 1.000.000</span></div>
  <p>Terima kasih, Ferdi!</p>
</div>
</body>
</html>
